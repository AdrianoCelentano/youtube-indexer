name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # JDK 17 is required. A JDK 21 JRE has no javac and fails with a
  # "does not provide the required capabilities: [JAVA_COMPILER]" toolchain error.
  JAVA_VERSION: '17'
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  static-analysis:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: Android Lint
        run: ./gradlew :androidApp:lintDebug :androidTvApp:lintDebug

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports
          path: |
            **/build/reports/ktlint/**
            **/build/reports/detekt/**
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore

  test:
    name: Shared unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runs commonTest via the androidHostTest compilation (withHostTest {} in
      # :shared's kotlin.android block). Without that, commonTest is never compiled.
      - name: Run shared tests
        run: ./gradlew :shared:allTests

      - name: Coverage report
        run: ./gradlew :shared:koverXmlReport :shared:koverHtmlReport

      # Renders both Compose surfaces on the JVM and diffs them against the goldens in
      # src/test/screenshots. No emulator is possible on this project's hardware
      # (see README), so this is the UI regression net.
      - name: Verify screenshots
        run: ./gradlew :androidApp:verifyRoborazziDebug :androidTvApp:verifyRoborazziDebug

      - name: Upload test, coverage & screenshot reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            shared/build/reports/tests/**
            shared/build/test-results/**
            shared/build/reports/kover/**
            **/build/outputs/roborazzi/**
            **/build/reports/roborazzi/**
          if-no-files-found: ignore

  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APKs
        run: ./gradlew :androidApp:assembleDebug :androidTvApp:assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            androidTvApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
